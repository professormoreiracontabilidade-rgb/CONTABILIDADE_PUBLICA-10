<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123f88"><title>Professor Moreira — Controle e Transparência</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#12284a;background:#e9f3ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#e4f0ff,#fff8dd);min-height:100vh}.wrap{width:min(950px,100%);padding:14px;margin:0 auto}.stage{background:#fff;min-height:calc(100dvh - 28px);border:3px solid #1455a4;border-radius:22px;box-shadow:0 8px 28px #0c3c7330;overflow:hidden;display:flex;flex-direction:column}.head{background:#1455a4;color:white;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.head strong{font-size:clamp(17px,3vw,23px)}.count{background:#ffe15b;color:#172c4c;border-radius:25px;padding:6px 12px;font-size:18px;font-weight:900}.content{flex:1;padding:clamp(16px,4vw,34px);overflow-wrap:break-word}.label{background:#ffde43;color:#172d51;border-radius:14px;padding:8px 16px;display:inline-block;font-size:19px;font-weight:900;letter-spacing:.03em}h1{font-size:clamp(30px,5vw,49px);color:#0d3d84;line-height:1.15;margin:17px 0 24px}p,li{font-size:clamp(23px,3.6vw,32px);line-height:1.42}p{margin:16px 0}li{margin:11px 0;padding-left:4px}ul{padding-left:32px}.tip{background:#fff5b8;border-left:9px solid #e4a800;border-radius:13px;padding:16px 18px;font-size:clamp(23px,3.6vw,31px);line-height:1.35;font-weight:800;margin:24px 0}.cover{background:linear-gradient(155deg,#0b3d89 0%,#1675d4 68%,#4ba5ff 100%);color:white}.cover .content{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.cover h1{color:#fff;font-size:clamp(33px,5.5vw,57px)}.cover p{font-weight:700;color:#fff}.cover .tip{color:#0b3d89}.footer{background:#f0f6ff;border-top:2px solid #cce0ff;padding:12px 14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.footer button{border:0;border-radius:13px;padding:14px 20px;font-size:clamp(19px,3vw,24px);font-weight:900;cursor:pointer;min-width:120px}.prev{background:#cfdef2;color:#0a3b7a}.restart{background:#ffd83f;color:#152f4e}.next{background:#075bc0;color:white}.footer button:disabled{opacity:.35;cursor:not-allowed}.signature{text-align:center;padding:6px;font-weight:800;color:#2b527b;font-size:14px}.progress{height:6px;background:#d3e5fa}.bar{height:100%;background:#f2c800;width:0;transition:width .15s}@media(max-width:430px){.wrap{padding:5px}.stage{min-height:calc(100dvh - 10px);border-radius:14px}.content{padding:16px}.footer button{flex:1;min-width:0;padding:13px 6px}.head{padding:11px}.label{font-size:16px}li{margin:8px 0}}
</style></head><body><main class="wrap"><section class="stage" id="stage"><header class="head"><strong>CURSO DE CONTABILIDADE PROFESSOR MOREIRA</strong><span class="count" id="count"></span></header><div class="progress"><div class="bar" id="bar"></div></div><article class="content" id="content"></article><nav class="footer" aria-label="Navegação"><button class="prev" id="prev">← Voltar</button><button class="restart" id="restart">↻ Reiniciar</button><button class="next" id="next">Ir →</button></nav><div class="signature">CONTABILIDADE PÚBLICA • PARTE 10</div></section></main><script>
const slides=[{"title": "CONTROLE E TRANSPARÊNCIA NA ADMINISTRAÇÃO PÚBLICA", "paragraphs": ["CONTABILIDADE PÚBLICA — PARTE 10", "Curso de Contabilidade Professor Moreira", "Teoria ampliada para concursos • Exemplos • Questões comentadas"], "bullets": [], "takeaway": "Use IR, VOLTAR e REINICIAR para navegar.", "label": "CAPA"}, {"title": "Controle e transparência: visão geral", "paragraphs": ["A contabilidade pública não se limita a registrar valores: ela produz informações para acompanhar a aplicação dos recursos públicos e avaliar a atuação dos gestores.", "Controle e transparência são complementares: a informação deve ser confiável, compreensível e acessível."], "bullets": [], "takeaway": "Registrar → Evidenciar → Fiscalizar → Prestar contas.", "label": "TEORIA"}, {"title": "Qual é a função da contabilidade?", "paragraphs": ["Permitir o acompanhamento da execução orçamentária e financeira, a avaliação da posição patrimonial e o levantamento das demonstrações contábeis.", "A Lei nº 4.320/1964, art. 85, estabelece os serviços de contabilidade para esse acompanhamento."], "bullets": [], "takeaway": "A contabilidade fornece a informação; o controle utiliza essa informação.", "label": "TEORIA"}, {"title": "Quais informações são produzidas?", "paragraphs": [], "bullets": ["Previsão e arrecadação de receitas.", "Fixação e execução das despesas.", "Disponibilidades de caixa e fluxos financeiros.", "Ativos, passivos e patrimônio líquido.", "Dívida pública e obrigações assumidas.", "Resultados patrimoniais e custos, conforme aplicável."], "takeaway": null, "label": "TEORIA"}, {"title": "Quem utiliza as informações?", "paragraphs": [], "bullets": ["Cidadãos e organizações da sociedade civil.", "Gestores públicos e responsáveis pela administração.", "Poder Legislativo e suas comissões.", "Tribunais de Contas e órgãos de controle interno.", "Órgãos de fiscalização e Ministério Público, conforme suas competências.", "Credores, fornecedores, pesquisadores e outros interessados."], "takeaway": null, "label": "TEORIA"}, {"title": "Três formas de controle", "paragraphs": [], "bullets": ["Controle interno: realizado no âmbito de cada Poder ou órgão por suas estruturas competentes.", "Controle externo: exercido pelo Legislativo, com auxílio dos Tribunais de Contas, nos termos constitucionais.", "Controle social: acompanhamento e participação da sociedade no uso dos recursos públicos."], "takeaway": "Interno ≠ externo ≠ social.", "label": "TEORIA"}, {"title": "Controle interno: o que faz?", "paragraphs": [], "bullets": ["Avalia o cumprimento das metas previstas no PPA.", "Comprova legalidade e avalia resultados da gestão orçamentária, financeira e patrimonial.", "Controla operações de crédito, avais, garantias, direitos e haveres.", "Apoia o controle externo no exercício de sua missão institucional."], "takeaway": "Base: art. 74 da Constituição Federal.", "label": "TEORIA"}, {"title": "Controle interno: exemplo prático", "paragraphs": ["Uma secretaria adquiriu computadores. O controle interno pode verificar a autorização, o processo de aquisição, a entrega, o registro patrimonial e a observância das regras aplicáveis."], "bullets": [], "takeaway": "Controlar é acompanhar a regularidade e a qualidade da gestão.", "label": "TEORIA"}, {"title": "Controle externo: quem exerce?", "paragraphs": ["O controle externo é exercido pelo Poder Legislativo, com auxílio dos Tribunais de Contas, conforme a esfera federativa e as competências previstas na Constituição.", "No plano federal, o Congresso Nacional exerce o controle externo com auxílio do Tribunal de Contas da União (TCU)."], "bullets": [], "takeaway": "TCU auxilia o Congresso Nacional; não substitui o Legislativo.", "label": "TEORIA"}, {"title": "Fiscalização: o que é examinado?", "paragraphs": [], "bullets": ["Aspectos contábeis, financeiros, orçamentários, operacionais e patrimoniais.", "Legalidade, legitimidade e economicidade.", "Aplicação de subvenções e renúncia de receitas."], "takeaway": "Base: art. 70 da Constituição Federal.", "label": "TEORIA"}, {"title": "Legalidade, legitimidade e economicidade", "paragraphs": [], "bullets": ["Legalidade: conformidade do ato com as normas jurídicas.", "Legitimidade: adequação da atuação ao interesse público e às finalidades previstas.", "Economicidade: utilização racional dos recursos, com atenção aos custos."], "takeaway": "Uma despesa pode ser legal e ainda exigir análise de economicidade.", "label": "TEORIA"}, {"title": "Eficiência, eficácia e efetividade", "paragraphs": [], "bullets": ["Eficiência: relação entre recursos utilizados e produtos/serviços entregues.", "Eficácia: grau de alcance das metas e dos objetivos planejados.", "Efetividade: efeitos reais da ação pública na sociedade."], "takeaway": "Exemplo: construir escola com menos desperdício, concluir as vagas previstas e melhorar o acesso à educação.", "label": "TEORIA"}, {"title": "Controle social e cidadania", "paragraphs": ["A sociedade pode acompanhar receitas, despesas, contratos, obras, serviços e resultados das políticas públicas.", "Portais de transparência, audiências públicas, conselhos e canais de ouvidoria fortalecem esse acompanhamento."], "bullets": [], "takeaway": "Controle social não se confunde com controle interno.", "label": "TEORIA"}, {"title": "Transparência ativa e passiva", "paragraphs": [], "bullets": ["Ativa: divulgação de informações de interesse coletivo ou geral independentemente de solicitação.", "Passiva: fornecimento de informações em resposta a pedidos de acesso, observadas as hipóteses legais de sigilo e proteção de dados."], "takeaway": "Base: Lei nº 12.527/2011 — Lei de Acesso à Informação (LAI).", "label": "TEORIA"}, {"title": "A transparência tem limites legais", "paragraphs": ["A publicidade é regra, mas informações protegidas por sigilo legal e dados pessoais requerem tratamento adequado.", "A administração deve conciliar acesso à informação, segurança, privacidade e proteção de dados pessoais."], "bullets": [], "takeaway": "Transparência não significa publicar indiscriminadamente dados pessoais.", "label": "TEORIA"}, {"title": "Lei de Responsabilidade Fiscal", "paragraphs": ["A Lei Complementar nº 101/2000 (LRF) estabelece normas de finanças públicas voltadas à responsabilidade na gestão fiscal.", "A transparência é reforçada pela ampla divulgação dos instrumentos definidos na LRF, inclusive em meios eletrônicos de acesso público."], "bullets": [], "takeaway": "Planejamento + equilíbrio fiscal + transparência + controle.", "label": "TEORIA"}, {"title": "Instrumentos de transparência fiscal", "paragraphs": [], "bullets": ["Planos, orçamentos e leis de diretrizes orçamentárias.", "Prestações de contas e respectivos pareceres prévios.", "Relatório Resumido da Execução Orçamentária (RREO).", "Relatório de Gestão Fiscal (RGF).", "Versões simplificadas dos documentos previstos na LRF."], "takeaway": "Art. 48 da LRF.", "label": "TEORIA"}, {"title": "RREO: o que acompanha?", "paragraphs": ["O Relatório Resumido da Execução Orçamentária evidencia informações da execução do orçamento e é publicado periodicamente conforme as regras legais.", "A Constituição Federal determina publicação até trinta dias após o encerramento de cada bimestre."], "bullets": [], "takeaway": "RREO: foco na execução orçamentária.", "label": "TEORIA"}, {"title": "RGF: qual é o foco?", "paragraphs": ["O Relatório de Gestão Fiscal permite acompanhar limites e condições de responsabilidade fiscal, como despesas com pessoal, dívida e garantias, conforme a legislação.", "Sua emissão é, em regra, quadrimestral, ressalvadas as situações específicas previstas na LRF."], "bullets": [], "takeaway": "RGF: foco na gestão fiscal e no cumprimento de limites.", "label": "TEORIA"}, {"title": "Prestação de contas x transparência", "paragraphs": [], "bullets": ["Prestação de contas: demonstrar e justificar o uso dos recursos e os resultados de gestão.", "Transparência: disponibilizar informações relevantes de forma acessível.", "Controle: verificar a conformidade, os resultados e a responsabilidade dos agentes."], "takeaway": "São conceitos relacionados, mas não equivalentes.", "label": "TEORIA"}, {"title": "PPA, LDO e LOA no controle", "paragraphs": [], "bullets": ["PPA: objetivos e metas de médio prazo.", "LDO: diretrizes e prioridades que orientam a elaboração da LOA.", "LOA: previsão de receitas e autorização de despesas do exercício."], "takeaway": "O controle compara planejamento, execução e resultados.", "label": "TEORIA"}, {"title": "Orçamento x patrimônio", "paragraphs": [], "bullets": ["Enfoque orçamentário: acompanha previsão e execução de receitas e despesas.", "Enfoque patrimonial: evidencia ativos, passivos, patrimônio líquido e variações patrimoniais.", "Enfoque financeiro: acompanha movimentações de recursos financeiros."], "takeaway": "A boa prestação de contas combina diferentes perspectivas.", "label": "TEORIA"}, {"title": "PCASP e DCASP", "paragraphs": [], "bullets": ["PCASP: padroniza a estrutura das contas para registros comparáveis e consolidação.", "DCASP: demonstrações contábeis que comunicam informações orçamentárias, financeiras e patrimoniais.", "Notas explicativas: ajudam a compreender critérios, saldos e informações relevantes."], "takeaway": "A padronização favorece a comparabilidade.", "label": "TEORIA"}, {"title": "Exemplo: construção de escola", "paragraphs": ["Um município prevê a construção de uma escola na LOA. A administração contrata a obra e realiza os registros correspondentes.", "O acompanhamento pode verificar autorização orçamentária, empenho, medições, liquidação, pagamentos, evolução física da obra e registros patrimoniais."], "bullets": [], "takeaway": null, "label": "TEORIA"}, {"title": "Exemplo: acompanhamento cidadão", "paragraphs": ["Um cidadão consulta o portal de transparência para identificar o valor contratado de uma obra, os pagamentos divulgados e o andamento do projeto.", "Ao encontrar divergência, pode pedir esclarecimentos por canais oficiais e encaminhar manifestação aos órgãos competentes."], "bullets": [], "takeaway": "Acesso à informação favorece fiscalização responsável.", "label": "TEORIA"}, {"title": "Exemplo numérico: execução", "paragraphs": ["Receita prevista no orçamento: R$ 2.000.000. Receita arrecadada: R$ 1.850.000.", "Despesa fixada: R$ 1.900.000. Despesa empenhada: R$ 1.750.000."], "bullets": [], "takeaway": "Atenção: para analisar o resultado orçamentário, compare receitas arrecadadas e despesas empenhadas.", "label": "TEORIA"}, {"title": "Resolução do exemplo", "paragraphs": ["Receitas arrecadadas: R$ 1.850.000.", "Despesas empenhadas: R$ 1.750.000.", "Resultado orçamentário: superávit de R$ 100.000."], "bullets": [], "takeaway": "Superávit orçamentário não significa necessariamente sobra igual em caixa.", "label": "TEORIA"}, {"title": "Controle preventivo, concomitante e posterior", "paragraphs": [], "bullets": ["Preventivo: antes da realização do ato, para prevenir irregularidades.", "Concomitante: durante a execução, permitindo acompanhamento e correções.", "Posterior: após a realização, para verificar resultados e conformidade."], "takeaway": "As três abordagens podem ser complementares.", "label": "TEORIA"}, {"title": "Responsabilização dos gestores", "paragraphs": ["Quem administra recursos públicos deve observar legalidade, transparência, finalidade e controles aplicáveis.", "A verificação de irregularidades pode gerar medidas corretivas e responsabilização conforme a legislação e o devido processo legal."], "bullets": [], "takeaway": "Nem toda falha contábil constitui automaticamente fraude.", "label": "TEORIA"}, {"title": "Pegadinhas frequentes em concursos", "paragraphs": [], "bullets": ["Controle externo da União é exercido pelo Congresso Nacional com auxílio do TCU.", "Controle social não substitui controles interno e externo.", "Transparência ativa independe de solicitação.", "RREO e RGF possuem finalidades distintas.", "Resultado orçamentário não é sinônimo de resultado patrimonial."], "takeaway": null, "label": "TEORIA"}, {"title": "Questão 1 — Certo ou errado", "paragraphs": ["O Tribunal de Contas da União exerce sozinho, em substituição ao Congresso Nacional, o controle externo federal."], "bullets": [], "takeaway": null, "label": "QUESTÃO"}, {"title": "Resolução da questão 1", "paragraphs": ["ERRADO. O controle externo é exercido pelo Congresso Nacional, com auxílio do TCU, conforme o art. 71 da Constituição Federal."], "bullets": [], "takeaway": "O Tribunal de Contas auxilia o Poder Legislativo.", "label": "GABARITO"}, {"title": "Questão 2 — Certo ou errado", "paragraphs": ["A transparência ativa ocorre quando o órgão divulga informações de interesse coletivo ou geral independentemente de requerimento."], "bullets": [], "takeaway": null, "label": "QUESTÃO"}, {"title": "Resolução da questão 2", "paragraphs": ["CERTO. A divulgação espontânea caracteriza a transparência ativa, observado o regime jurídico de acesso à informação."], "bullets": [], "takeaway": "Transparência passiva: resposta a pedido.", "label": "GABARITO"}, {"title": "Questão 3 — Certo ou errado", "paragraphs": ["O resultado orçamentário positivo de um exercício garante que o ente público terminou o ano com o mesmo valor de saldo disponível em caixa."], "bullets": [], "takeaway": null, "label": "QUESTÃO"}, {"title": "Resolução da questão 3", "paragraphs": ["ERRADO. Resultado orçamentário e saldo de caixa representam informações diferentes. O primeiro considera receitas arrecadadas e despesas empenhadas; o segundo depende dos fluxos e saldos financeiros."], "bullets": [], "takeaway": null, "label": "GABARITO"}, {"title": "Revisão final para a prova", "paragraphs": [], "bullets": ["Controle interno: realizado nos próprios Poderes.", "Controle externo: Legislativo com auxílio dos Tribunais de Contas.", "Controle social: sociedade acompanha a gestão pública.", "LAI: transparência ativa e passiva.", "LRF: transparência da gestão fiscal; RREO e RGF.", "Contabilidade: base informacional para controle e prestação de contas."], "takeaway": "Quem quer ser aprovado ESTUDA!", "label": "RESUMO"}];const key='profmoreira_controle_transparencia_parte10';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let i=Number(localStorage.getItem(key)||0);if(!Number.isInteger(i)||i<0||i>=slides.length)i=0;function render(){let s=slides[i],e=document.getElementById('content');document.getElementById('stage').classList.toggle('cover',i===0);e.innerHTML=`<span class="label">${esc(s.label)}</span><h1>${esc(s.title)}</h1>${s.paragraphs.map(x=>'<p>'+esc(x)+'</p>').join('')}${s.bullets.length?'<ul>'+s.bullets.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''}${s.takeaway?'<div class="tip">'+esc(s.takeaway)+'</div>':''}`;document.getElementById('count').textContent=`Tela ${i+1} de ${slides.length}`;document.getElementById('bar').style.width=`${(i+1)*100/slides.length}%`;document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===slides.length-1;localStorage.setItem(key,i);window.scrollTo({top:0,behavior:'instant'})}document.getElementById('prev').onclick=()=>{if(i>0){i--;render()}};document.getElementById('next').onclick=()=>{if(i<slides.length-1){i++;render()}};document.getElementById('restart').onclick=()=>{i=0;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&i<slides.length-1){i++;render()}if(e.key==='ArrowLeft'&&i>0){i--;render()}});render();</script></body></html>
